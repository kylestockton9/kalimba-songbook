<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Kalimba Songbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen app. Library is a scrolling list; the player stacks a scrolling score over a fixed wooden board of 17 steel tines. */
:root {
  --bg: #EDF1EA; --surface: #F9FBF6; --fg: #1B2622; --muted: #5C6B64; --line: #CFD8CF;
  --accent: #0B6E60; --accent-fg: #FFFFFF;
  --hot: #E89B00; --hot-soft: #FBE7B8; --hot-fg: #2A1C00;
  --wood-1: #8E5932; --wood-2: #5E3519; --bridge: #2B2F31;
  --steel-1: #F4F6F7; --steel-2: #A9B2B7; --tine-fg: #2A3033;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1B2320; --fg: #E7ECE6; --muted: #93A29A; --line: #2C3833;
    --accent: #56CDB4; --accent-fg: #06241E;
    --hot: #FFBE2E; --hot-soft: #4A3A10; --hot-fg: #2A1C00;
    --wood-1: #6B3F22; --wood-2: #3A1F0F; --bridge: #0E1011;
    --steel-1: #DDE2E5; --steel-2: #8A9399; --tine-fg: #1D2224;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1B2320; --fg: #E7ECE6; --muted: #93A29A; --line: #2C3833;
  --accent: #56CDB4; --accent-fg: #06241E;
  --hot: #FFBE2E; --hot-soft: #4A3A10; --hot-fg: #2A1C00;
  --wood-1: #6B3F22; --wood-2: #3A1F0F; --bridge: #0E1011;
  --steel-1: #DDE2E5; --steel-2: #8A9399; --tine-fg: #1D2224;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.view { height: 100%; display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Library ---------- */
#library { overflow-y: auto; }
.lib-inner { width: 100%; max-width: 720px; margin: 0 auto; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 28px; }
.lib-head h1 { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1.05; margin: 0 0 8px; text-wrap: balance; letter-spacing: -0.01em; }
.lib-head p { margin: 0; color: var(--muted); max-width: 46ch; }
.tuning { margin-top: 14px; display: flex; gap: 3px; align-items: flex-start; height: 34px; }
.tuning i { flex: 1; max-width: 14px; border-radius: 0 0 6px 6px; background: linear-gradient(90deg, var(--steel-2), var(--steel-1) 45%, var(--steel-2)); border: 1px solid var(--line); }
.cat h2 { font-family: var(--display); font-weight: 500; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.songs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.song { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 4px; min-height: 56px; }
.song:hover .song-title { color: var(--accent); }
.song-main { flex: 1; min-width: 0; }
.song-title { font-weight: 700; font-size: 1.05rem; display: block; }
.song-meta { color: var(--muted); font-size: 0.85rem; display: block; }
.level { display: flex; gap: 3px; flex: none; }
.level i { width: 6px; height: 14px; border-radius: 3px; background: var(--line); }
.level i.on { background: var(--accent); }
.tick { width: 22px; height: 22px; flex: none; color: var(--accent); visibility: hidden; }
.song.learned .tick { visibility: visible; }

/* ---------- Player ---------- */
.bar-top { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: none; border: 1px solid var(--line); border-radius: 12px; }
.icon-btn svg, .ctl svg { width: 22px; height: 22px; }
.now { flex: 1; min-width: 0; }
.now h2 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now span { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.listen { flex: none; min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: none; border: 1px solid var(--line); border-radius: 12px; font-size: 0.85rem; font-weight: 700; }
.listen svg { width: 20px; height: 20px; }
.listen.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.listen .lvl { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .25; }
.progress { height: 3px; background: var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

#score { flex: 1; min-height: 0; overflow-y: auto; position: relative; padding-block: 14px; display: flex; flex-direction: column; gap: 10px; }
.phrase { display: flex; flex-wrap: wrap; gap: 5px 4px; align-items: flex-end; }
.chip { width: 32px; height: 46px; padding: 0; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; line-height: 1; }
.chip .dots { height: 8px; font-size: 9px; letter-spacing: 1px; }
.chip .num { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.chip .let { font-size: 0.65rem; color: var(--muted); padding-bottom: 4px; padding-top: 2px; }
.chip.done { opacity: .45; }
.chip.cur { background: var(--hot); border-color: var(--hot); color: var(--hot-fg); transform: scale(1.08); }
.chip.cur .let { color: var(--hot-fg); }
.done-card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.done-card strong { font-family: var(--display); font-size: 1.1rem; flex: 1 1 140px; }
.pill { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 9px 16px; font-weight: 700; min-height: 44px; }
.pill.ghost { background: none; color: var(--accent); }

.controls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding-block: 8px; }
.ctl { min-width: 0; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 2px; font-size: 0.7rem; color: var(--muted); }
.ctl svg { color: var(--fg); }
.ctl b { font-family: var(--display); font-size: 0.95rem; color: var(--fg); height: 22px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.ctl.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.ctl.primary svg { color: var(--accent-fg); }

.board { flex: none; height: clamp(190px, 46%, 380px); position: relative; background: linear-gradient(180deg, var(--wood-1), var(--wood-2)); border-radius: 0 0 18px 18px; padding-top: 12px; padding-bottom: 10px; touch-action: none; user-select: none; -webkit-user-select: none; }
.board::before { content: ""; position: absolute; left: 0; right: 0; top: 26px; height: 9px; background: var(--bridge); box-shadow: 0 2px 3px rgba(0,0,0,.35); z-index: 2; pointer-events: none; }
.tines { height: 100%; max-width: 720px; margin: 0 auto; display: flex; gap: 2px; align-items: flex-start; }
.tine { flex: 1; min-width: 0; height: 100%; background: none; border: 0; padding: 0; display: flex; align-items: flex-start; position: relative; }
.tine .bar { width: 100%; height: var(--len); border-radius: 2px 2px 999px 999px; background: linear-gradient(90deg, var(--steel-2), var(--steel-1) 40%, var(--steel-1) 55%, var(--steel-2)); box-shadow: 0 2px 4px rgba(0,0,0,.4); color: var(--tine-fg); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 9px; line-height: 1; transition: transform .08s; }
.tine .dots { font-size: 8px; height: 8px; letter-spacing: 0; }
.tine .num { font-family: var(--display); font-weight: 700; font-size: 0.85rem; }
.tine .let { font-size: 0.62rem; margin-top: 3px; opacity: .75; }
.tine.then .bar { box-shadow: inset 0 0 0 2px var(--hot), 0 2px 4px rgba(0,0,0,.4); }
.tine.next .bar { background: var(--hot); color: var(--hot-fg); box-shadow: 0 0 0 2px var(--hot-soft), 0 0 22px 4px var(--hot); animation: pulse 1.1s ease-in-out infinite; }
.tine.next::after { content: attr(data-run); position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 700; color: var(--hot); white-space: nowrap; }
.tine.hit .bar { transform: translateY(4px); }
.tine.miss .bar { animation: shake .25s; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--hot-soft), 0 0 8px 1px var(--hot); } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .tine.next .bar, .tine.miss .bar { animation: none; } .progress i { transition: none; } }
@media (max-height: 520px) { .chip { height: 40px; } .controls { padding-block: 4px; } .ctl { min-height: 44px; } }
</style>

<div id="library" class="view">
  <div class="lib-inner gutter">
    <header class="lib-head">
      <h1>Kalimba Songbook</h1>
      <p>For a 17-key kalimba tuned in C. Pick a tune and the key to play next lights up. Tap it, or press Play and follow along on your own kalimba.</p>
      <div class="tuning" id="tuning" aria-hidden="true"></div>
    </header>
    <div id="cats"></div>
  </div>
</div>

<div id="player" class="view" hidden>
  <div class="bar-top gutter">

    <div class="now"><h2 id="now-title"></h2><span id="now-pos"></span></div>

  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="board gutter" id="board"><div class="tines" id="tines"></div></div>
  <div id="score" class="gutter"></div>
  <div class="controls gutter">
    <button class="ctl" id="btn-start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg>Start</button>
    <button class="ctl" id="btn-phrase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Line</button>
    <button class="ctl" id="btn-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>Note</button>
    <button class="ctl primary" id="btn-play"><svg id="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg><span id="lbl-play">Play</span></button>
    <button class="ctl" id="btn-speed" aria-label="Playback speed"><b id="lbl-speed">100%</b>Speed</button>
    <button class="ctl" id="btn-mute"><svg id="ico-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 010 6"/></svg><span id="lbl-mute">Sound</span></button>
  </div>
</div>

  { c: "Classical", t: "Brahms' Lullaby", lv: 3, bpm: 90, s: "E4:.5 E4:.5 G4:2 E4:.5 E4:.5 G4:2 | E4:.5 G4:.5 C5 B4:1.5 A4:.5 A4 G4 | D4:.5 E4:.5 F4 D4 D4:.5 E4:.5 F4:2 | D4:.5 F4:.5 B4:.5 A4:.5 G4 B4 C5:2 | C4:.5 C4:.5 C5:2 A4:.5 F4:.5 G4:2 | E4:.5 C4:.5 F4 G4 A4 G4:2 | C4:.5 C4:.5 C5:2 A4:.5 F4:.5 G4:2 | E4:.5 C4:.5 F4 E4 D4 C4:3" },
  { c: "Classical", t: "Canon in D theme (played in C)", lv: 3, bpm: 110, s: "E5:2 D5:2 C5:2 B4:2 | A4:2 G4:2 A4:2 B4:2 | C5 E5 G5 F5 E5 C5 E5 D5 | C5 A4 C5 G5 F5 A5 G5 F5 | E5:4" },
  { c: "Classical", t: "Minuet in G (played in C)", lv: 3, bpm: 120, s: "G5 C5:.5 D5:.5 E5:.5 F5:.5 G5 C5 C5 | A5 F5:.5 G5:.5 A5:.5 B5:.5 C6 C5 C5 | F5 G5:.5 F5:.5 E5:.5 D5:.5 E5 F5:.5 E5:.5 D5:.5 C5:.5 | B4 C5:.5 D5:.5 E5:.5 C5:.5 D5:3" },

  { c: "Hymns and holiday", t: "Amazing Grace", lv: 2, bpm: 90, s: "G4 C5:2 E5:.5 C5:.5 E5:2 D5 C5:2 A4 G4:2 | G4 C5:2 E5:.5 C5:.5 E5:2 D5 G5:5 | E5 G5:1.5 E5:.5 G5:.5 E5:.5 C5:2 G4 A4:1.5 C5:.5 C5:.5 A4:.5 G4:2 | G4 C5:2 E5:.5 C5:.5 E5:2 D5 C5:3" },
  { c: "Hymns and holiday", t: "Jingle Bells", lv: 1, bpm: 140, s: "E4 E4 E4:2 E4 E4 E4:2 | E4 G4 C4:1.5 D4:.5 E4:4 | F4 F4 F4:1.5 F4:.5 F4 E4 E4 E4:.5 E4:.5 | E4 D4 D4 E4 D4:2 G4:2 | E4 E4 E4:2 E4 E4 E4:2 | E4 G4 C4:1.5 D4:.5 E4:4 | F4 F4 F4:1.5 F4:.5 F4 E4 E4 E4:.5 E4:.5 | G4 G4 F4 D4 C4:4" },
  { c: "Hymns and holiday", t: "Silent Night", lv: 2, bpm: 90, s: "G4:1.5 A4:.5 G4 E4:3 | G4:1.5 A4:.5 G4 E4:3 | D5:2 D5 B4:3 | C5:2 C5 G4:3 | A4:2 A4 C5:1.5 B4:.5 A4 | G4:1.5 A4:.5 G4 E4:3 | A4:2 A4 C5:1.5 B4:.5 A4 | G4:1.5 A4:.5 G4 E4:3 | D5:2 D5 F5:1.5 D5:.5 B4 | C5:3 E5:3 | C5 G4 E4 G4:1.5 F4:.5 D4 | C4:3" },
  { c: "Hymns and holiday", t: "Joy to the World", lv: 2, bpm: 110, s: "C5:2 B4:1.5 A4:.5 G4:3 F4 | E4:2 D4:2 C4:3 | G4 A4:3 A4 B4:3 B4 C5:3 | C5 C5 B4 A4 G4 G4:1.5 F4:.5 E4 | C5 C5 B4 A4 G4 G4:1.5 F4:.5 E4 | E4 E4 E4 E4 E4:.5 F4:.5 G4:3 | F4:.5 E4:.5 D4 D4 D4 D4:.5 E4:.5 F4:3 | E4:.5 D4:.5 C4 C5:2 A4 G4:1.5 F4:.5 E4 F4 | E4:2 D4:2 C4:4" },
  { c: "Hymns and holiday", t: "We Wish You a Merry Christmas", lv: 2, bpm: 140, s: "G4 C5 C5:.5 D5:.5 C5:.5 B4:.5 A4 A4 | A4 D5 D5:.5 E5:.5 D5:.5 C5:.5 B4 G4 | G4 E5 E5:.5 F5:.5 E5:.5 D5:.5 C5 A4 | G4:.5 G4:.5 A4 D5 B4 C5:3" },

  { c: "Jingles and calls", t: "Doorbell", lv: 1, bpm: 80, s: "E5:2 C5:2" },
  { c: "Jingles and calls", t: "Charge!", lv: 1, bpm: 130, s: "G4:.5 C5:.5 E5:.5 G5:.75 E5:.25 G5:2" },
  { c: "Jingles and calls", t: "Shave and a Haircut", lv: 1, bpm: 130, s: "C5 G4:.5 G4:.5 A4 G4 _ | B4 C5:2" },
  { c: "Jingles and calls", t: "Westminster Chimes", lv: 1, bpm: 80, s: "E5 C5 D5 G4:2 | G4 D5 E5 C5:2 | E5 D5 C5 G4:2 | G4 D5 E5 C5:2" },
  { c: "Jingles and calls", t: "Taps", lv: 2, bpm: 70, s: "G4:.75 G4:.25 C5:3 | G4:.75 C5:.25 E5:3 | G4:.5 C5:.5 E5 G4:.5 C5:.5 E5 G4:.5 C5:.5 E5:3 | C5:.75 E5:.25 G5:2 E5 C5 G4:3 | G4:.75 G4:.25 C5:4" }
];

const TINES = ["D6","B5","G5","E5","C5","A4","F4","D4","C4","E4","G4","B4","D5","F5","A5","C6","E6"];
const SEMI = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const $ = id => document.getElementById(id);
const freq = n => 440 * Math.pow(2, (12 * (+n[1] + 1) + SEMI[n[0]] - 69) / 12);
const degree = n => "CDEFGAB".indexOf(n[0]) + 1;
const dots = n => "•".repeat(+n[1] - 4);
const SPEEDS = [1, 0.75, 0.5];

function parse(song) {
  const notes = [];
  song.s.split("|").forEach((line, p) => {
    line.trim().split(/\s+/).forEach(tok => {
      const [n, d] = tok.split(":"), beats = d ? parseFloat(d) : 1;
      if (n === "_") { if (notes.length) notes[notes.length - 1].d += beats; }
      else notes.push({ n, d: beats, p });
    });
  });
  return notes;
}
SONGS.forEach(s => { s.notes = parse(s); });

// ---------- saved "learned" marks (this browser only) ----------
let learned = {};
try { learned = JSON.parse(localStorage.getItem("kalimba-learned") || "{}") || {}; } catch (e) {}
function saveLearned() { try { localStorage.setItem("kalimba-learned", JSON.stringify(learned)); } catch (e) {} }

// ---------- sound ----------
let ac = null, master = null, muted = false;
function ensureAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createDynamicsCompressor(); master.connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
}
function pluck(n) {
  if (muted || listening) return; // while listening the app stays silent so it cannot hear itself
  try {
    ensureAudio();
    const t = ac.currentTime, f = freq(n);
    const voice = (mult, type, peak, decay) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f * mult;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + decay + 0.05);
    };
    voice(1, "sine", 0.5, 1.8);
    voice(2, "triangle", 0.07, 0.6);
    voice(5.4, "sine", 0.1, 0.12);
  } catch (e) {}
}

// ---------- listening: hear the real kalimba through the microphone ----------
// Every 30 ms, measure how loud each of the 17 tine pitches is. A tine whose pitch suddenly jumps was just plucked.
const canListen = !window.claude && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let listening = false, micStream = null, micSrc = null, analyser = null, listenTimer = null, heard = "", micNote = "";
let buf = null, hann = null, hannSum = 1, coef = null, hist = [], floor = 0.001, cand = -1, lastAny = 0;
const lastHit = new Array(17).fill(0);
const BY_PITCH = TINES.map((_, i) => i).sort((x, y) => freq(TINES[x]) - freq(TINES[y]));
const PITCH_RANK = []; BY_PITCH.forEach((t, r) => { PITCH_RANK[t] = r; });

function attachAnalyser(node) {
  analyser = ac.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0;
  node.connect(analyser);
  const N = analyser.fftSize;
  buf = new Float32Array(N); hann = new Float32Array(N); hannSum = 0;
  for (let k = 0; k < N; k++) { hann[k] = 0.5 - 0.5 * Math.cos(2 * Math.PI * k / (N - 1)); hannSum += hann[k]; }
  coef = TINES.map(n => 2 * Math.cos(2 * Math.PI * freq(n) / ac.sampleRate));
  hist = []; floor = 0.001; cand = -1;
  clearInterval(listenTimer); listenTimer = setInterval(analyse, 30);
}
function analyse() {
  analyser.getFloatTimeDomainData(buf);
  const N = buf.length, m = new Array(17);
  for (let i = 0; i < 17; i++) {
    const c = coef[i]; let s1 = 0, s2 = 0;
    for (let k = 0; k < N; k++) { const s = buf[k] * hann[k] + c * s1 - s2; s2 = s1; s1 = s; }
    m[i] = 2 * Math.sqrt(Math.max(0, s1 * s1 + s2 * s2 - c * s1 * s2)) / hannSum;
  }
  hist.push(m); if (hist.length > 6) hist.shift();
  const med = m.slice().sort((a, b) => a - b)[8];
  floor = floor * 0.95 + med * 0.05;
  $("lvl").style.opacity = Math.min(1, 0.25 + Math.max.apply(null, m) * 25);
  if (hist.length < 3) return;
  // Compare each pitch with its quietest moment in the last 150 ms, so a re-plucked note still counts as a jump.
  const old = new Array(17);
  for (let i = 0; i < 17; i++) { let q = Infinity; for (let h = 0; h < hist.length - 1; h++) if (hist[h][i] < q) q = hist[h][i]; old[i] = q; }
  let best = -1, rise = 0;
  for (let i = 0; i < 17; i++) { const r = m[i] - old[i]; if (r > rise) { rise = r; best = i; } }
  const now = performance.now();
  const loud = best >= 0 && rise > Math.max(0.0015, floor * 6) && rise > 0.25 * m[best] && m[best] > 3 * med;
  if (!loud) { cand = -1; return; }
  // A note being damped smears a little energy onto the pitches either side of it; ignore those echoes.
  const r = PITCH_RANK[best], lo = BY_PITCH[r - 1], hi = BY_PITCH[r + 1];
  if ((lo !== undefined && m[lo] * 0.6 > m[best]) || (hi !== undefined && m[hi] * 0.6 > m[best])) { cand = -1; return; }
  if (cand !== best) { cand = best; return; } // wait for the same answer twice in a row
  if (now - lastHit[best] < 160 || now - lastAny < 100) return;
  // A phone mic can pick up the octave overtone louder than the note itself; give the expected note the benefit.
  if (song && idx < song.notes.length) {
    const e = TINES.indexOf(song.notes[idx].n);
    if (e !== best && TINES[e][0] === TINES[best][0] && +TINES[best][1] === +TINES[e][1] + 1 && m[e] - old[e] > 0.3 * rise) best = e;
  }
  lastHit[best] = now; lastAny = now; cand = -1;
  const up = TINES.indexOf(TINES[best][0] + (+TINES[best][1] + 1)); if (up >= 0) lastHit[up] = now; // its overtone is not a second pluck
  onHeard(best);
}
function onHeard(i) {
  heard = TINES[i];
  if (!song || playing || idx >= song.notes.length) { if (song) showPos(); return; }
  if (TINES[i] === song.notes[idx].n) { flash(i, "hit"); idx++; update(); if (idx >= song.notes.length) finished(true); }
  else { flash(i, "miss"); showPos(); }
}
async function startListening() {
  stop(); micNote = "";
  try {
    ensureAudio(); await ac.resume();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    micNote = "Microphone is blocked. Allow it in the browser's site settings, then tap Listen again.";
    showPos(); return;
  }
  micSrc = ac.createMediaStreamSource(micStream);
  attachAnalyser(micSrc);
  listening = true; heard = ""; setListenUi(); showPos();
}
function stopListening() {
  clearInterval(listenTimer); listenTimer = null;
  try { micSrc && micSrc.disconnect(); micStream && micStream.getTracks().forEach(t => t.stop()); } catch (e) {}
  micSrc = micStream = analyser = null;
  if (listening) { listening = false; setListenUi(); if (song) showPos(); }
}
function setListenUi() {
  $("btn-listen").classList.toggle("on", listening);
  $("btn-listen").setAttribute("aria-pressed", listening);
  $("lbl-listen").textContent = listening ? "Listening" : "Listen";
  if (!listening) $("lvl").style.opacity = "";
}

// ---------- library ----------
function renderLibrary() {
  const cats = [...new Set(SONGS.map(s => s.c))];
  $("cats").innerHTML = "";
  const wrap = $("cats"); wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.gap = "28px";
  cats.forEach(c => {
    const sec = document.createElement("section"); sec.className = "cat";
    const h = document.createElement("h2"); h.textContent = c; sec.appendChild(h);
    const list = document.createElement("div"); list.className = "songs";
    SONGS.forEach((s, i) => {
      if (s.c !== c) return;
      const b = document.createElement("button");
      b.className = "song" + (learned[s.t] ? " learned" : "");
      b.innerHTML = '<span class="song-main"><span class="song-title"></span><span class="song-meta"></span></span>' +
        '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Played through"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' +
        '<span class="level" aria-hidden="true">' + [1,2,3].map(k => '<i class="' + (k <= s.lv ? "on" : "") + '"></i>').join("") + '</span>';
      b.querySelector(".song-title").textContent = s.t;
      b.querySelector(".song-meta").textContent = s.notes.length + " notes · " + ["Easy","Medium","Harder"][s.lv - 1];
      b.addEventListener("click", () => openSong(i));
      list.appendChild(b);
    });
    sec.appendChild(list); wrap.appendChild(sec);
  });
}
$("tuning").innerHTML = TINES.map((_, i) => '<i style="height:' + (100 - Math.abs(i - 8) * 6) + '%"></i>').join("");

// ---------- board ----------
const tineEls = TINES.map((n, i) => {
  const b = document.createElement("button");
  b.className = "tine"; b.setAttribute("aria-label", n);
  b.style.setProperty("--len", (100 - Math.abs(i - 8) * 5.2) + "%");
  b.innerHTML = '<span class="bar"><span class="dots">' + dots(n) + '</span><span class="num">' + degree(n) + '</span><span class="let">' + n[0] + '</span></span>';
  b.addEventListener("click", e => { if (e.detail === 0) strike(i); }); // keyboard only; touch is handled below
  $("tines").appendChild(b);
  return b;
});
$("board").addEventListener("pointerdown", e => {
  const r = $("tines").getBoundingClientRect();
  if (e.clientX < r.left - 8 || e.clientX > r.right + 8) return;
  e.preventDefault();
  strike(Math.max(0, Math.min(16, Math.floor((e.clientX - r.left) / r.width * 17))));
});
function flash(i, cls) {
  const el = tineEls[i]; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), cls === "hit" ? 110 : 260);
}
function strike(i) {
  pluck(TINES[i]);
  if (playing || !song || idx >= song.notes.length) { flash(i, "hit"); return; }
  if (TINES[i] === song.notes[idx].n) { flash(i, "hit"); idx++; update(); if (idx >= song.notes.length) finished(true); }
  else flash(i, "miss");
}

// ---------- player ----------
let song = null, songIndex = 0, idx = 0, chips = [], playing = false, timer = null, speed = 1, wake = null;

function openSong(i) {
  songIndex = i; song = SONGS[i]; idx = 0;
  $("now-title").textContent = song.t;
  const sc = $("score"); sc.innerHTML = ""; chips = [];
  let row = null, last = -1;
  song.notes.forEach((nt, k) => {
    if (nt.p !== last) { row = document.createElement("div"); row.className = "phrase"; sc.appendChild(row); last = nt.p; }
    const c = document.createElement("button"); c.className = "chip";
    c.style.marginRight = Math.min(14, Math.max(0, (nt.d - 1) * 5)) + "px";
    c.setAttribute("aria-label", "Jump to note " + (k + 1) + ", " + nt.n);
    c.innerHTML = '<span class="dots">' + dots(nt.n) + '</span><span class="num">' + degree(nt.n) + '</span><span class="let">' + nt.n[0] + '</span>';
    c.addEventListener("click", () => jump(k));
    row.appendChild(c); chips.push(c);
  });
  const done = document.createElement("div"); done.className = "done-card"; done.id = "done"; done.hidden = true;
  done.innerHTML = '<strong>That\'s the whole tune.</strong><button class="pill ghost" id="again">Play it again</button><button class="pill" id="nextsong">Next song</button>';
  sc.appendChild(done);
  done.querySelector("#again").addEventListener("click", () => jump(0));
  done.querySelector("#nextsong").addEventListener("click", () => openSong((songIndex + 1) % SONGS.length));
  $("library").hidden = true; $("player").hidden = false;
  sc.scrollTop = 0; update();
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (e) {}
}
function showPos() {
  const N = song.notes.length;
  let t = idx < N ? "Note " + (idx + 1) + " of " + N : "Finished · " + N + " notes";
  if (micNote) t = micNote; else if (listening) t += heard ? " · heard " + heard[0] + (dots(heard) ? " " + dots(heard) : "") : " · pluck a key";
  $("now-pos").textContent = t;
}
function closeSong() {
  stop(); stopListening(); micNote = ""; song = null;
  try { wake && wake.release(); } catch (e) {} wake = null;
  $("player").hidden = true; $("library").hidden = false; renderLibrary();
}
function update() {
  const N = song.notes.length;
  chips.forEach((c, k) => { c.classList.toggle("done", k < idx); c.classList.toggle("cur", k === idx); });
  showPos();
  $("prog").style.width = (idx / N * 100) + "%";
  $("done").hidden = idx < N;
  const cur = idx < N ? song.notes[idx].n : null;
  let run = 0; if (cur) while (idx + run < N && song.notes[idx + run].n === cur) run++;
  let then = null; if (cur && idx + run < N) then = song.notes[idx + run].n;
  tineEls.forEach((el, i) => {
    el.classList.toggle("next", TINES[i] === cur);
    el.classList.toggle("then", TINES[i] === then);
    el.dataset.run = TINES[i] === cur && run > 1 ? "×" + run : "";
  });
  const target = idx < N ? chips[idx] : $("done"), sc = $("score");
  const top = target.offsetTop - sc.clientHeight / 2 + target.offsetHeight / 2;
  sc.scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function jump(k) {
  const was = playing; stop();
  idx = Math.max(0, Math.min(song.notes.length, k)); update();
  if (was && idx < song.notes.length) play();
}
function finished(byHand) {
  if (byHand) { learned[song.t] = 1; saveLearned(); }
}
function play() {
  stopListening();
  if (idx >= song.notes.length) idx = 0;
  playing = true; setPlayUi(); update(); tick();
}
function tick() {
  if (!playing) return;
  const nt = song.notes[idx];
  pluck(nt.n); flash(TINES.indexOf(nt.n), "hit");
  timer = setTimeout(() => {
    idx++; update();
    if (idx >= song.notes.length) { stop(); return; }
    tick();
  }, nt.d * 60000 / song.bpm / speed);
}
function stop() { playing = false; clearTimeout(timer); setPlayUi(); }
function setPlayUi() {
  $("lbl-play").textContent = playing ? "Pause" : "Play";
  $("ico-play").innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>';
}
$("btn-back").addEventListener("click", closeSong);
$("btn-start").addEventListener("click", () => jump(0));
$("btn-prev").addEventListener("click", () => jump(idx - 1));
$("btn-phrase").addEventListener("click", () => {
  const N = song.notes.length, at = Math.min(idx, N - 1), p = song.notes[at].p;
  let k = at; while (k > 0 && song.notes[k - 1].p === p) k--;
  if (k === idx && k > 0) { const q = song.notes[k - 1].p; k--; while (k > 0 && song.notes[k - 1].p === q) k--; }
  jump(k);
});
$("btn-play").addEventListener("click", () => { playing ? stop() : play(); });
$("btn-speed").addEventListener("click", () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  $("lbl-speed").textContent = Math.round(speed * 100) + "%";
});
$("btn-mute").addEventListener("click", () => {
  muted = !muted;
  $("lbl-mute").textContent = muted ? "Muted" : "Sound";
  $("ico-mute").innerHTML = muted ? '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 010 6"/>';
});
$("btn-listen").hidden = !canListen;
$("btn-listen").addEventListener("click", () => { listening ? stopListening() : startListening(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { if (playing) stop(); stopListening(); } });

renderLibrary();
</script>
</body></html>
